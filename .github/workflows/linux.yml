name: Linux AppImage

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  map-inputs:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub exposes draft release assets only to accounts with push access.
    steps:
      - name: Download verified public terrain inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.3.0 --repo "$GITHUB_REPOSITORY" --pattern 'FlashFront-0.3.0-map-inputs.tar.gz' --dir /tmp
          echo 'e831719fc4ce4908dce933fcc3712c9bd1dce072bd0ecfa2268aa27e07f578b8  /tmp/FlashFront-0.3.0-map-inputs.tar.gz' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: verified-map-inputs
          path: /tmp/FlashFront-0.3.0-map-inputs.tar.gz
          retention-days: 1
  linux:
    needs: map-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm via Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron runtime and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 xvfb xauth \
            libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0t64 \
            libnspr4 libnss3 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
      - name: Cache map inputs
        id: maps
        uses: actions/cache@v4
        with:
          path: |
            tools/spawn/.cache
            apps/launcher/build/training-maps
          key: maps-${{ hashFiles('apps/launcher/resources/training/engine-manifest.json', 'packages/core/src/spawn/heatmaps.json') }}
      - name: Download verified map inputs
        if: steps.maps.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: verified-map-inputs
          path: /tmp
      - name: Extract verified map inputs
        if: steps.maps.outputs.cache-hit != 'true'
        run: |
          echo 'e831719fc4ce4908dce933fcc3712c9bd1dce072bd0ecfa2268aa27e07f578b8  /tmp/FlashFront-0.3.0-map-inputs.tar.gz' | sha256sum -c -
          tar -xzf /tmp/FlashFront-0.3.0-map-inputs.tar.gz
      - name: Validate spawn test terrain
        run: node scripts/prepare-ci-maps.mjs
      - name: Save prepared map inputs
        if: steps.maps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tools/spawn/.cache
            apps/launcher/build/training-maps
          key: ${{ steps.maps.outputs.cache-primary-key }}
      - name: Test
        run: pnpm -r test
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build AppImage
        run: pnpm --dir apps/launcher dist:linux
      - name: Smoke-test AppImage
        timeout-minutes: 3
        shell: bash
        run: |
          chmod +x ./apps/launcher/release/FlashFront-*.AppImage
          status=0
          FLASHFRONT_SMOKE_TEST=1 xvfb-run -a ./apps/launcher/release/FlashFront-*.AppImage --no-sandbox > smoke.log 2>&1 || status=$?
          cat smoke.log

          test "$status" -eq 0
          grep -q '^SMOKE PASS:' smoke.log
      - name: Check Linux koffi binary (Task 6)
        run: |
          ls node_modules/.pnpm/@koromix+koffi-linux-x64@3.3.3/node_modules/@koromix/koffi-linux-x64/linux_x64/koffi.node
          test -s apps/launcher/release/linux-unpacked/resources/koffi/linux_x64/koffi.node
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: FlashFront-Linux-AppImage
          path: |
            apps/launcher/release/FlashFront-*.AppImage
            apps/launcher/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7
